[tool.bumpversion]
current_version = "0.6.0.dev0"
commit = true
tag = false                      # GitHub Release creates the tag at publish; only tag final versions
allow_dirty = false
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:\\.(?P<pre_l>dev)(?P<pre_n>\\d+))?
"""
serialize = [
    "{major}.{minor}.{patch}.{pre_l}{pre_n}",
    "{major}.{minor}.{patch}",
]

# pre-release label: "dev" while in development, "final" drops the suffix (a release)
[tool.bumpversion.parts.pre_l]
values = ["dev", "final"]
optional_value = "final"

[tool.bumpversion.parts.pre_n]
first_value = "0"

[[tool.bumpversion.files]]
filename = "setup.cfg"
search = "version = {current_version}"
replace = "version = {new_version}"

[[tool.bumpversion.files]]
filename = "mf6rtm/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
