[workspace]
name = "mf6rtm"
description = "MODFLOW 6 reactive transport module"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[dependencies]
#\python = ">=3.10,<3.14"
pandas = "*"
geopandas = "*"
numpy = "*"
matplotlib = "*"
pytest = "*"
pytest-cov = "*"
modflow-devtools = "*"
pip = "*"
flaky = "*"
coverage = "*"
coveralls = "*"
flake8 = "*"
jupytext = "*"
nbconvert = "*"
nbformat = "*"
ipykernel = "*"
phreeqcrm = "*"
flopy = "*"
modflowapi = "*"
toml = "*"
pytables = "*"
sqlite = ">=3.39"

# MODFLOW feature placeholder
[feature.modflow.dependencies]
# MODFLOW binaries installed via tasks

[feature.py310.dependencies]
python = "3.10.*"

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.docs.dependencies]
sphinx = "*"
myst-nb = "*"
furo = "*"
sphinx-autodoc-typehints = "*"
sphinxext-opengraph = "*"
pyshp = "*"

[feature.release.dependencies]
bump-my-version = "*"

[feature.release.tasks]
# release finalize: 0.5.0.dev0 -> 0.5.0 ; next cycle: bump minor -> 0.6.0.dev0
bump = "bump-my-version bump"
version = "bump-my-version show current_version"

[environments]
py310 = { features = ["py310", "modflow"], solve-group = "py310" }
py311 = { features = ["py311", "modflow"], solve-group = "py311" }
py312 = { features = ["py312", "modflow"], solve-group = "py312" }
py313 = { features = ["py313", "modflow"], solve-group = "py313" }
docs = { features = ["docs", "py313", "modflow"], solve-group = "py313" }
release = { features = ["release"] }

[tasks]
install-package = { cmd = "pip install -e ." }
install-modflow = { cmd = "get-modflow --repo modflow6-nightly-build :python" }
install-gridgen = { cmd = "get-modflow --repo executables --subset gridgen :python" }
test = { cmd = "pytest -v", depends-on = ["install-modflow", "install-package", "install-benchmark-bins"] }
test-cov = { cmd = "pytest -v --cov=mf6rtm --cov-report=term-missing", depends-on = ["install-modflow", "install-package", "install-benchmark-bins"] }
coveralls = { cmd = "coveralls --service=github", depends-on = ["test-cov"] }
lint = { cmd = "flake8 mf6rtm" }
clean = { cmd = "rm -rf .pixi/tmp .pytest_cache .coverage htmlcov" }
exec-tutorials = { cmd = "jupytext --to notebook --execute docs/tutorials/*.py", depends-on = ["install-modflow", "install-gridgen", "install-package", "install-benchmark-bins"] }
build-docs = { cmd = "sphinx-build -b html docs docs/_build/html", depends-on = ["exec-tutorials"] }

[target.linux-64.tasks]
install-benchmark-bins = { cmd = "get-modflow benchmark/bin/linux --subset mf6,libmf6" }

[target.osx-arm64.tasks]
install-benchmark-bins = { cmd = "get-modflow benchmark/bin/mac --subset mf6,libmf6" }

[target.osx-64.tasks]
install-benchmark-bins = { cmd = "get-modflow benchmark/bin/mac --subset mf6,libmf6" }

[target.win-64.tasks]
install-benchmark-bins = { cmd = "get-modflow benchmark/bin/win --subset mf6,libmf6" }
