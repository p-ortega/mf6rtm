name: Speed test

on:
  workflow_dispatch:
    inputs:
      previous:
        description: "Previous release to compare against (e.g. 0.5.2)"
        required: true

jobs:
  speedtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # tags are needed to export the previous release's benchmark/

    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.9.3
      with:
        pixi-version: v0.76.0
        cache: true

    - name: Run speed test
      env:
        PREVIOUS: ${{ inputs.previous }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # get-modflow, avoids the API rate limit
      run: |
        set -o pipefail
        pixi run speedtest --previous "$PREVIOUS" 2>&1 | tee speedtest.log

    - name: Upload table and log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: speedtest-${{ inputs.previous }}-vs-${{ github.sha }}
        path: |
          speedtest.md
          speedtest.log
        if-no-files-found: ignore
